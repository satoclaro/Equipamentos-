<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claro - Controle de Equipamentos</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
        :root { --claro-red: #E30613; --bg-color: #f4f4f9; }
        body { font-family: Arial, sans-serif; margin: 0; padding: 12px; background: var(--bg-color); color: #333; }
        h2 { color: var(--claro-red); text-align: center; margin-bottom: 16px; font-size: 20px; }
        .card { background: white; padding: 16px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 16px; }
        label { font-weight: bold; font-size: 13px; display: block; margin-top: 10px; color: #555; }
        input, select { width: 100%; padding: 12px; margin-top: 4px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; background: #fff; }
        button { background: var(--claro-red); color: white; border: none; padding: 14px; border-radius: 6px; font-size: 16px; width: 100%; margin-top: 14px; cursor: pointer; font-weight: bold; }
        button.secondary { background: #444; margin-top: 8px; }
        button.danger { background: #d9534f; padding: 6px 10px; font-size: 12px; width: auto; margin-top: 0; }
        #reader { width: 100%; max-height: 250px; display: none; margin-top: 10px; border-radius: 6px; overflow: hidden; }
        .table-container { overflow-x: auto; margin-top: 10px; max-height: 300px; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; white-space: nowrap; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #eee; position: sticky; top: 0; }
        .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; background: #eef; color: #333; }
    </style>
</head>
<body>

    <h2>Claro - Leitor e Controle de Campo</h2>

    <div class="card">
        <label for="contrato">Número do Contrato / OS</label>
        <input type="text" id="contrato" placeholder="Ex: 001234567">

        <label for="tipo">Tipo de Equipamento</label>
        <select id="tipo">
            <option value="ONT">ONT (Fibra Óptica)</option>
            <option value="EMTA">EMTA (Modem HFC)</option>
            <option value="DECODER">Decoder TV 4K / HD</option>
            <option value="CHIP">Chip / ICCID Movel</option>
            <option value="MESH">Roteador Mesh Wi-Fi</option>
        </select>

        <label for="mac">MAC / Serial / ICCID</label>
        <input type="text" id="mac" placeholder="Escaneie ou digite o código...">
        <button type="button" class="secondary" onclick="toggleScanner()">📷 Ligar / Desligar Câmera (Scanner)</button>
        <div id="reader"></div>

        <button onclick="salvarEquipamento()">Salvar Equipamento</button>
    </div>

    <div class="card">
        <h3>Equipamentos Registrados (<span id="contador">0</span>)</h3>
        <button class="secondary" onclick="exportarCSV()">📥 Baixar Relatório (CSV para Excel)</button>
        <div class="table-container">
            <table id="tabela-dados">
                <thead>
                    <tr>
                        <th>Contrato</th>
                        <th>Tipo</th>
                        <th>MAC / Serial</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

<script>
    let dados = JSON.parse(localStorage.getItem('claro_equipamentos_v1') || '[]');
    let html5QrCode = null;
    let cameraAtiva = false;

    atualizarTabela();

    function toggleScanner() {
        const readerDiv = document.getElementById('reader');
        if (!cameraAtiva) {
            readerDiv.style.display = 'block';
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 100 } },
                (decodedText) => {
                    document.getElementById('mac').value = decodedText.trim().toUpperCase();
                    pararScanner();
                },
                (errorMessage) => {}
            ).catch(err => {
                alert("Erro ao acessar a câmera. Verifique as permissões do navegador: " + err);
            });
            cameraAtiva = true;
        } else {
            pararScanner();
        }
    }

    function pararScanner() {
        if (html5QrCode && cameraAtiva) {
            html5QrCode.stop().then(() => {
                document.getElementById('reader').style.display = 'none';
                cameraAtiva = false;
            }).catch(err => console.log(err));
        } else {
            document.getElementById('reader').style.display = 'none';
            cameraAtiva = false;
        }
    }

    function salvarEquipamento() {
        const contrato = document.getElementById('contrato').value.trim();
        const tipo = document.getElementById('tipo').value;
        const mac = document.getElementById('mac').value.trim().toUpperCase();

        if (!contrato || !mac) {
            alert("Atenção: Preencha o Número do Contrato e o MAC/Serial do equipamento!");
            return;
        }

        const novoItem = { id: Date.now(), contrato, tipo, mac };
        dados.unshift(novoItem);
        localStorage.setItem('claro_equipamentos_v1', JSON.stringify(dados));

        document.getElementById('mac').value = ''; 
        atualizarTabela();
    }

    function deletarItem(id) {
        if (confirm("Deseja remover este item da lista?")) {
            dados = dados.filter(item => item.id !== id);
            localStorage.setItem('claro_equipamentos_v1', JSON.stringify(dados));
            atualizarTabela();
        }
    }

    function atualizarTabela() {
        const tbody = document.querySelector('#tabela-dados tbody');
        tbody.innerHTML = '';
        document.getElementById('contador').innerText = dados.length;

        if (dados.length === 0) {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td colspan="4" style="text-align:center; color:#888;">Nenhum equipamento registrado ainda.</td>`;
            tbody.appendChild(tr);
            return;
        }

        dados.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><b>${item.contrato}</b></td>
                <td><span class="badge">${item.tipo}</span></td>
                <td>${item.mac}</td>
                <td><button class="danger" onclick="deletarItem(${item.id})">Excluir</button></td>
            `;
            tbody.appendChild(tr);
        });
    }

    function exportarCSV() {
        if (dados.length === 0) {
            alert("Não há dados cadastrados para exportar.");
            return;
        }
        let csvContent = "data:text/csv;charset=utf-8,Contrato;Tipo;MAC_Serial\n";
        dados.forEach(item => {
            csvContent += `${item.contrato};${item.tipo};${item.mac}\n`;
        });
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "relatorio_equipamentos_claro.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>

</body>
</html>
